services:
  postgres:
    image: postgres:16-alpine
    container_name: homespace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: homespace
      POSTGRES_USER: homespace
      POSTGRES_PASSWORD: homespace
    ports:
      # Host 5433 -> container 5432 (5432 is used by another local project's Postgres)
      - "5433:5432"
    volumes:
      - homespace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homespace -d homespace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  homespace_pgdata:
