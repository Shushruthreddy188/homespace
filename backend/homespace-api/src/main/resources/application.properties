server.port=${PORT:4000}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.cors.allowedOrigin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5174}

# --- Seeding ---
# When true and the DB is empty, load listings/users from seed-data.json on boot.
app.seed.enabled=${APP_SEED_ENABLED:false}

# --- Auth: self-issued JWT ---
# HS256 signing secret (>= 32 bytes). MUST be provided in production.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-ttl-seconds=${APP_JWT_ACCESS_TTL:900}
app.jwt.refresh-token-ttl-seconds=${APP_JWT_REFRESH_TTL:1209600}

# --- Refresh-token cookie ---
# In production the frontend and API are on different sites, so the browser
# requires SameSite=None; Secure for the cookie to be sent cross-site over HTTPS.
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:true}
app.auth.cookie.same-site=${APP_AUTH_COOKIE_SAMESITE:None}

# --- Google OAuth2 / OIDC ---
# Google login is enabled only when a client registration is provided. To turn it on,
# supply these standard Spring env vars (the registration is intentionally NOT declared
# here, so the app boots fine with Google login disabled):
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=<your-client-id>
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET=<your-client-secret>
app.oauth2.frontend-redirect-uri=${APP_OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:5173/oauth/callback}
