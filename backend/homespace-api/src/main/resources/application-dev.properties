# Local development profile — activate with SPRING_PROFILES_ACTIVE=dev
# Connects to the Postgres started by docker-compose.yml at the repo root.

spring.datasource.url=jdbc:postgresql://localhost:5433/homespace
spring.datasource.username=homespace
spring.datasource.password=homespace

# Allow both Vite's default port (5173) and the previously configured 5174.
app.cors.allowedOrigin=http://localhost:5173,http://localhost:5174

# Seed listings/users from the frontend mock data on first boot (empty DB only).
app.seed.enabled=true

# --- Auth (dev values — DO NOT use these in production) ---
# HS256 signing secret for our self-issued JWTs. Must be >= 32 bytes.
app.jwt.secret=dev-only-super-secret-change-me-please-32bytes-minimum!!
app.jwt.access-token-ttl-seconds=900
app.jwt.refresh-token-ttl-seconds=1209600

# Refresh-token cookie flags. localhost is same-site across ports, so Lax works over http.
app.auth.cookie.secure=false
app.auth.cookie.same-site=Lax

# Google OAuth: to enable social login, provide these (via env vars or an untracked
# application-local.properties). Leaving them out runs the app with Google login disabled.
#   spring.security.oauth2.client.registration.google.client-id=<your-client-id>
#   spring.security.oauth2.client.registration.google.client-secret=<your-client-secret>

# Where to send the browser back to after a successful Google login.
app.oauth2.frontend-redirect-uri=http://localhost:5173/oauth/callback
